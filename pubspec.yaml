name: bytecraft
description: "Bytecraft World — игровое обучение Python: учись, пиши код, строй IT-город и соревнуйся."
publish_to: "none"
version: 0.4.0+3

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management + DI
  flutter_riverpod: ^3.0.0
  # Declarative routing
  go_router: ^17.0.0
  # Local persistence (key-value, JSON documents)
  shared_preferences: ^2.5.3
  # HTTP for remote content / future backend
  dio: ^5.8.0
  # In-app Python: Pyodide runs in a WebView (see assets/python_runner)
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/world/
    - assets/content/
    - assets/content/python/
    - assets/content/python/modules/
    - assets/python_runner/
    - assets/pyodide/

  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
        - asset: assets/fonts/Onest-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
