name: bytecraft
description: "Bytecraft — мобильная игра для обучения программированию короткими головоломками."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management + DI
  flutter_riverpod: ^3.0.0
  # Declarative routing
  go_router: ^17.0.0
  # Local persistence (key-value, JSON documents)
  shared_preferences: ^2.5.3
  # HTTP for remote content / future backend
  dio: ^5.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/python/
    - assets/content/python/modules/
