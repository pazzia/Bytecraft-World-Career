name: Import World Career history

on:
  push:
    branches: [main]
    paths:
      - '.migration/**'
      - '.github/workflows/import-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify and restore Git history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          parts = sorted(Path('.migration').glob('part-*.bundle'))
          assert len(parts) == 26, len(parts)
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '224e9761686b3864d8d8a850419242dc7fd0e0634801bd1c1ca92a88099b4bf2'
          Path('/tmp/project.bundle').write_bytes(data)
          PY
          git bundle verify /tmp/project.bundle
          git fetch /tmp/project.bundle 'refs/heads/*:refs/remotes/import/*'
          test "$(git rev-parse refs/remotes/import/main)" = "10b7dfbe07d9d3047ec84f60fc875a5ac36c8dc7"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          SOURCE_COMMIT="$(git rev-parse refs/remotes/import/main)"
          SOURCE_TREE="$(git rev-parse "$SOURCE_COMMIT^{tree}")"
          IMPORT_COMMIT="$(printf '%s\n' 'Complete World Career migration, preserving source and bootstrap histories' | git commit-tree "$SOURCE_TREE" -p "$GITHUB_SHA" -p "$SOURCE_COMMIT")"
          git push --atomic origin \
            "$IMPORT_COMMIT:refs/heads/main" \
            refs/remotes/import/prototype/world:refs/heads/prototype/world \
            refs/remotes/import/prototype/career:refs/heads/prototype/career \
            refs/remotes/import/reference/course-main:refs/heads/reference/course-main \
            refs/remotes/import/reference/design:refs/heads/reference/design
          echo "Imported main: $IMPORT_COMMIT"
