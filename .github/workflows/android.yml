name: Bytecraft CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bytecraft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android shell
        run: |
          flutter --version | tee flutter-version.txt
          flutter create --platforms=android --org com.pazzia --project-name bytecraft .
          # flutter create adds a counter-app test that doesn't apply here.
          rm -f test/widget_test.dart
          # App name and launcher icon (the generated shell has Flutter's).
          sed -i 's/android:label="bytecraft"/android:label="Bytecraft"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="Bytecraft"' android/app/src/main/AndroidManifest.xml
          cp -r tool/android/res/. android/app/src/main/res/

      - name: Install dependencies
        run: flutter pub get 2>&1 | tee pub.txt

      - name: Analyze
        id: analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.txt

      - name: Unit tests
        id: tests
        if: always() && steps.analyze.conclusion != 'skipped'
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.txt

      # Every build gets a higher versionCode, otherwise Android refuses
      # to update the installed app.
      - name: Build release APK
        id: apk
        run: |
          set -o pipefail
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          flutter build apk --release \
            --build-name="$VERSION" --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} 2>&1 | tee apk.txt

      # The permanent signing key lives in the GitHub Actions cache (see
      # docs/RELEASE.md). The cache key never changes, so the key is
      # created once and every later build is signed with the same key.
      - name: Restore signing key
        id: key-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bytecraft-signing
          key: bytecraft-signing-v1

      - name: Sign APK
        id: sign
        env:
          # Optional override: repository secrets take priority over the cache.
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Only main may create the permanent key: caches saved by PR runs
          # are invisible to main and would give a different key.
          CAN_CREATE_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          KEY_DIR="$HOME/.bytecraft-signing"
          TEMP_KS="$RUNNER_TEMP/temp.jks"
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$TEMP_KS"
            KS="$TEMP_KS"
            SOURCE=secrets
          elif [ -f "$KEY_DIR/release.jks" ]; then
            KS="$KEY_DIR/release.jks"
            KEYSTORE_PASSWORD="$(cat "$KEY_DIR/password")"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=bytecraft
            SOURCE=cache
          elif [ "$CAN_CREATE_KEY" = true ]; then
            mkdir -p "$KEY_DIR"
            openssl rand -hex 24 > "$KEY_DIR/password"
            KEYSTORE_PASSWORD="$(cat "$KEY_DIR/password")"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=bytecraft
            keytool -genkeypair -keystore "$KEY_DIR/release.jks" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -dname "CN=Bytecraft, O=pazzia" >/dev/null 2>&1
            KS="$KEY_DIR/release.jks"
            SOURCE=created
          else
            # A PR before the key exists: a throwaway key keeps the signing
            # path exercised, but the APK can't update an installed app.
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=throwaway
            keytool -genkeypair -keystore "$TEMP_KS" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
              -storepass "$KEYSTORE_PASSWORD" -dname "CN=Throwaway" >/dev/null 2>&1
            KS="$TEMP_KS"
            SOURCE=throwaway
          fi
          export KEYSTORE_PASSWORD KEY_PASSWORD
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/signed.apk" \
            "$APK"
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$TEMP_KS"
          {
            case "$SOURCE" in
              cache) echo "Signed with the permanent key (from the Actions cache)." ;;
              created) echo "Created the permanent key and signed with it." ;;
              secrets) echo "Signed with the key from repository secrets." ;;
              *) echo "⚠️ No permanent key yet (it is created by the first build on main): signed with a throwaway key." ;;
            esac
            echo "apksigner: $BUILD_TOOLS"
            # verify fails the step on a bad signature; the summary lines
            # differ between build-tools versions, so fall back to all output.
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > verify.txt
            grep -iE "certificate (DN|SHA-256)|Verified using" verify.txt || cat verify.txt
          } 2>&1 | tee sign.txt
          FINGERPRINT="$(grep -iE 'certificate SHA-256' verify.txt | head -n 1 | sed 's/.*: *//' || true)"
          if [ "$SOURCE" = throwaway ]; then SIGNED=false; else SIGNED=true; fi
          {
            echo "signed=$SIGNED"
            echo "source=$SOURCE"
            echo "fingerprint=$FINGERPRINT"
          } >> "$GITHUB_OUTPUT"

      - name: Save new signing key
        if: steps.sign.outputs.source == 'created'
        uses: actions/cache/save@v4
        with:
          path: ~/.bytecraft-signing
          key: bytecraft-signing-v1

      # Logs are posted to the PR so results are readable without Actions log access.
      - name: Report to pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          section() {
            local title="$1" file="$2" lines="$3"
            echo "<details><summary>$title</summary>"
            echo
            echo '```'
            if [ -f "$file" ]; then tail -n "$lines" "$file"; else echo "(step did not run)"; fi
            echo '```'
            echo "</details>"
          }
          {
            echo "### CI: version=${{ steps.apk.outputs.version }}+${{ github.run_number }} · analyze=${{ steps.analyze.outcome }} · tests=${{ steps.tests.outcome }} · apk=${{ steps.apk.outcome }} · release-signed=${{ steps.sign.outputs.signed || 'n/a' }} · key=${{ steps.sign.outputs.source || 'n/a' }}"
            echo
            section "Flutter version" flutter-version.txt 6
            section "pub get" pub.txt 40
            section "flutter analyze" analyze.txt 150
            if grep -q "EXCEPTION CAUGHT BY" test.txt 2>/dev/null; then
              awk '/EXCEPTION CAUGHT BY/{found=1} found{print; n++} n>=70{exit}' test.txt > first-failure.txt
              section "first test exception" first-failure.txt 70
            fi
            section "flutter test" test.txt 150
            section "build apk" apk.txt 40
            section "signing" sign.txt 10
          } > report.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bytecraft-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        # Push to main, or a manual "Run workflow" on main (e.g. after the
        # signing secrets changed).
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
          SOURCE: ${{ steps.sign.outputs.source }}
          FINGERPRINT: ${{ steps.sign.outputs.fingerprint }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          TAG="mvp-${GITHUB_RUN_NUMBER}"
          APK_NAME="bytecraft-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          NOTES="Bytecraft ${VERSION}, build ${GITHUB_RUN_NUMBER}, from commit ${GITHUB_SHA}."
          if [ "$SIGNED" = "true" ]; then
            NOTES="$(printf '%s\n\n%s' "$NOTES" "Signing certificate SHA-256: ${FINGERPRINT}")"
          else
            NOTES="$(printf '%s\n\n%s' "$NOTES" "⚠️ Signed with a temporary key: uninstall the previous build before installing this one. See docs/RELEASE.md.")"
          fi
          if [ "$SOURCE" = "created" ]; then
            NOTES="$(printf '%s\n\n%s' "$NOTES" "First build with the permanent key: uninstall older builds once. From now on, updates install over this one.")"
          fi
          gh release create "$TAG" \
            "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Bytecraft ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES"
