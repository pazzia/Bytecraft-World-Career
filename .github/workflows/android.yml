name: Bytecraft CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bytecraft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android shell
        run: |
          flutter --version | tee flutter-version.txt
          flutter create --platforms=android --org com.pazzia --project-name bytecraft .
          # flutter create adds a counter-app test that doesn't apply here.
          rm -f test/widget_test.dart
          # App name and launcher icon (the generated shell has Flutter's).
          sed -i 's/android:label="bytecraft"/android:label="Bytecraft"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="Bytecraft"' android/app/src/main/AndroidManifest.xml
          cp -r tool/android/res/. android/app/src/main/res/

      - name: Install dependencies
        run: flutter pub get 2>&1 | tee pub.txt

      - name: Analyze
        id: analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.txt

      - name: Unit tests
        id: tests
        if: always() && steps.analyze.conclusion != 'skipped'
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.txt

      # Every build gets a higher versionCode, otherwise Android refuses
      # to update the installed app.
      - name: Build release APK
        id: apk
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee apk.txt

      # Re-sign with the release key from repository secrets (see
      # docs/RELEASE.md). Without secrets every build gets a different key
      # and can't be installed over a previous build.
      - name: Sign APK with release key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            SIGNED=true
          else
            # No secrets (yet): sign with a throwaway key so the signing
            # path is still exercised on every run.
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=throwaway
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
              -storepass "$KEYSTORE_PASSWORD" -dname "CN=Throwaway" >/dev/null 2>&1
            export KEYSTORE_PASSWORD KEY_PASSWORD
            SIGNED=false
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/signed.apk" \
            "$APK"
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$KS"
          {
            if [ "$SIGNED" = true ]; then
              echo "Signed with the release key."
            else
              echo "⚠️ Release key secrets are not set: signed with a throwaway key (see docs/RELEASE.md)."
            fi
            echo "apksigner: $BUILD_TOOLS"
            # verify fails the step on a bad signature; the summary lines
            # differ between build-tools versions, so fall back to all output.
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > verify.txt
            grep -iE "certificate (DN|SHA-256)|Verified using" verify.txt || cat verify.txt
          } 2>&1 | tee sign.txt
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      # Logs are posted to the PR so results are readable without Actions log access.
      - name: Report to pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          section() {
            local title="$1" file="$2" lines="$3"
            echo "<details><summary>$title</summary>"
            echo
            echo '```'
            if [ -f "$file" ]; then tail -n "$lines" "$file"; else echo "(step did not run)"; fi
            echo '```'
            echo "</details>"
          }
          {
            echo "### CI: analyze=${{ steps.analyze.outcome }} · tests=${{ steps.tests.outcome }} · apk=${{ steps.apk.outcome }} · release-signed=${{ steps.sign.outputs.signed || 'n/a' }}"
            echo
            section "Flutter version" flutter-version.txt 6
            section "pub get" pub.txt 40
            section "flutter analyze" analyze.txt 150
            section "flutter test" test.txt 150
            section "build apk" apk.txt 40
            section "signing" sign.txt 10
          } > report.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bytecraft-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          TAG="mvp-${GITHUB_RUN_NUMBER}"
          NOTES="Android build ${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA}."
          if [ "$SIGNED" != "true" ]; then
            NOTES="$(printf '%s\n\n%s' "$NOTES" "⚠️ Signed with a temporary debug key: uninstall the previous build before installing this one. See docs/RELEASE.md.")"
          fi
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Bytecraft MVP build ${GITHUB_RUN_NUMBER}" \
            --notes "$NOTES"
